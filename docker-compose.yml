services:
  ibeam:
    image: voyz/ibeam:latest
    environment:
      IBEAM_ACCOUNT: ${IBKR_USERNAME}
      IBEAM_PASSWORD: ${IBKR_PASSWORD}
    ports:
      - "5000:5000"
      # app shares ibeam's network namespace, so its port is published here
      - "8000:8000"
    healthcheck:
      # /tickle returns 200 once the session is authenticated
      test: ["CMD", "curl", "-sf", "-k", "https://localhost:5000/v1/api/tickle"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  app:
    build: .
    # Share ibeam's network namespace so IBKR gateway sees requests as localhost
    network_mode: "service:ibeam"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL so the app uses the internal docker hostname "db"
      # rather than the localhost value in .env
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Gateway is localhost from within ibeam's network namespace
      IBKR_BASE_URL: https://localhost:5000
    depends_on:
      db:
        condition: service_healthy
      ibeam:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/.venv  # isolates container venv from Windows host — prevents Linux symlinks (lib64) polluting the host .venv
    command: sh -c "uv sync --frozen && uv run alembic upgrade head && uv run python scripts/seed.py && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
