[project]
name = "macro-agents"
version = "0.1.0"
description = "Agent-powered macro hedge fund system"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Templating (Jinja2 for server-rendered UI)
    "jinja2>=3.1.0",
    "python-multipart>=0.0.12",
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.0",
    # pgvector extension support for semantic thesis search
    "pgvector>=0.3.0",
    # Config / validation
    "pydantic-settings>=2.7.0",
    # Anthropic API — all LLM calls go through AnthropicClient
    "anthropic>=0.40.0",
    # HTTP client for IBKR Client Portal API and OECD API
    "httpx>=0.28.0",
    # Scheduled jobs (daily monitoring, weekly rebalance)
    "apscheduler>=3.10.0",
    # Async email for alert delivery
    "aiosmtplib>=3.0.0",
]

[dependency-groups]
dev = [
    "black>=24.0.0",
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade — enforce modern Python syntax
    "B",  # flake8-bugbear
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
